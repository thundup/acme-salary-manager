name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acme
          POSTGRES_PASSWORD: acme
          POSTGRES_DB: acme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acme" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://acme:acme@localhost:5432/acme
      TEST_DATABASE_URL: postgresql://acme:acme@localhost:5432/acme_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: PGPASSWORD=acme psql -h localhost -U acme -d acme -c "CREATE DATABASE acme_test"
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run python -m app.seed
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag acme-salary-manager .
      - run: docker run --detach --name acme --publish 8000:8000 acme-salary-manager
      - name: Wait for the app to migrate, seed and start
        run: |
          for i in $(seq 1 30); do
            curl --silent --fail http://localhost:8000/api/health && exit 0
            sleep 2
          done
          docker logs acme
          exit 1
      - name: Smoke test the API and the UI from the same origin
        run: |
          curl --silent --fail "http://localhost:8000/api/employees?page_size=1" | grep '"total":10000'
          curl --silent --fail http://localhost:8000/insights | grep 'id="root"'
